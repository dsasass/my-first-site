    const GENRE_RULES = {
      war: ["войнуш","сраж","оружи","войн","арен","дуэл","шут","стрельб","арми","боев","убий","полиц","райд","штурм"],
      car: ["машин","гонк","муддинг","внедорож","гараж","такс","транспорт","скорост","авто"],
      moto: ["мотоцикл","мопед","байк","скутер"],
      rp: ["ролев","город","жизн","семь","больниц","деревн","пляж","остров","магаз"],
      sim: ["симулятор","бизнес","ферм","ресторан","магаз","тикон","строй","работ","заработ"],
      horror: ["хорро","страшн","побег","выжив","зомби","кошм","тёмн","монстр","призрак"],
      defense: ["башн","стратег","оборон","замок","защит"],
      pet: ["питомец","пчел","звер","живот","яйц","собери"]
    };

    document.getElementById('totalCount').textContent = GAMES.length;

    let state = { page: 1, search: '', genre: '' };
    const gridEl = document.getElementById('grid');
    const pageEl = document.getElementById('pagination');
    const shownEl = document.getElementById('shownCount');

    function matches(g) {
      const q = state.search.trim().toLowerCase();
      const gn = g.n.toLowerCase();
      if (q && !gn.includes(q) && !g.d.toLowerCase().includes(q)) return false;
      if (state.genre) {
        const kws = GENRE_RULES[state.genre] || [];
        if (!kws.some(k => gn.includes(k))) return false;
      }
      return true;
    }

    function render() {
      const filtered = GAMES.filter(matches);
      const totalPages = Math.max(1, Math.ceil(filtered.length / PER_PAGE));
      if (state.page > totalPages) state.page = totalPages;
      const start = (state.page - 1) * PER_PAGE;
      const slice = filtered.slice(start, start + PER_PAGE);

      gridEl.innerHTML = '';
      if (slice.length === 0) {
        gridEl.innerHTML = '<div class="no-results">Ничего не найдено. Попробуйте изменить фильтр.</div>';
      } else {
        slice.forEach((g, idx) => {
          const absNum = start + idx + 1;
          const card = document.createElement('div');
          card.className = 'card';
          const link = 'roblox://experiences/start?placeId=' + g.id;
          card.innerHTML =
            '<div class="cover" style="background:' + g.c + ';">' +
              '<div class="tile">' + g.n.charAt(0).toUpperCase() + '</div>' +
              '<div class="rank">' + absNum + '</div>' +
            '</div>' +
            '<div class="body">' +
              '<h2>' + g.n + '</h2>' +
              '<p class="desc">' + g.d + '</p>' +
              '<a class="btn-play" href="' + link + '"><span>▶</span> Играть</a>' +
            '</div>';
          gridEl.appendChild(card);
        });
      }
      shownEl.textContent = 'Показано: ' + slice.length + ' из ' + filtered.length;

      let total = totalPages;
      let win = [];
      for (let p = 1; p <= total; p++) {
        if (p === 1 || p === total || (p >= state.page - 1 && p <= state.page + 1)) win.push(p);
      }
      let html = '<button class="page-btn" data-p="' + (state.page-1) + '"' + (state.page<=1?' disabled':'') + '>‹</button>';
      let prev = 0;
      win.forEach(p => {
        if (p - prev > 1) html += '<span class="page-btn" style="border:none;background:transparent;cursor:default;">…</span>';
        html += '<button class="page-btn' + (p===state.page?' active':'') + '" data-p="' + p + '">' + p + '</button>';
        prev = p;
      });
      html += '<button class="page-btn" data-p="' + (state.page+1) + '"' + (state.page>=total?' disabled':'') + '>›</button>';
      pageEl.innerHTML = html;
      pageEl.querySelectorAll('.page-btn[data-p]').forEach(function(b) {
        b.onclick = function() {
          var p = parseInt(b.dataset.p, 10);
          if (p >= 1 && p <= totalPages) { state.page = p; render(); window.scrollTo({top:0, behavior:'smooth'}); }
        };
      });
    }

    document.getElementById('search').addEventListener('input', function(e){ state.search = e.target.value; state.page = 1; render(); });
    document.getElementById('genre').addEventListener('change', function(e){ state.genre = e.target.value; state.page = 1; render(); });

    render();
  </script>
